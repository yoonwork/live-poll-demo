<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F2F4F7">
<title>손번쩍 · 실시간 설문·Q&amp;A 제안용 데모</title>
<meta name="description" content="행사 진행자가 QR로 참여자를 모으고, 설문·퀴즈·워드클라우드·Q&amp;A 결과를 실시간으로 보는 웹 서비스의 제안용 데모예요. 이름과 숫자는 모두 예시예요.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232457F5'/%3E%3Crect x='8' y='15' width='4' height='9' rx='2' fill='white'/%3E%3Crect x='14' y='8' width='4' height='16' rx='2' fill='white'/%3E%3Crect x='20' y='12' width='4' height='12' rx='2' fill='white' opacity='.7'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style id="tokens">
:root{
  color-scheme: light;
  --brand:#2457F5; --brand-hover:#1B45D6; --brand-press:#1638B0; --brand-text:#1B45D6;
  --brand-tint:#EEF3FF; --brand-tint-2:#D9E4FF; --ring:0 0 0 3px rgba(36,87,245,.25); --on-brand:#FFFFFF;
  --bg:#F2F4F7; --card:#FFFFFF; --soft:#F7F8FA; --track:#ECEFF3; --line:#E5E8EB; --line-2:#EBEEF2;
  --ink:#191F28; --ink-2:#4E5968; --mut:#636D7B; --mut-2:#9AA3AE;
  --ok:#127A4F; --ok-bg:#E3F6ED; --ok-dot:#1FA971;
  --warn:#7A5600; --warn-bg:#FFF3D4; --warn-dot:#F2B01E;
  --bad:#BF2930; --bad-bg:#FFE3E4; --bad-dot:#E5484D;
  --info:#175CD3; --info-bg:#EAF2FF; --info-dot:#2E7CF6;
  --neu:#4E5968; --neu-bg:#F0F2F5; --neu-dot:#8B95A1;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --r-sm:8px; --r-md:12px; --r-lg:20px; --r-xl:28px; --r-pill:999px;
  --sh-pill:0 1px 2px rgba(16,24,40,.08);
  --sh-pop:0 2px 6px rgba(16,24,40,.06),0 12px 32px rgba(16,24,40,.12);
  --h-sm:32px; --h-md:40px; --h-lg:48px; --h-cta:52px;
  /* 파스텔 포인트 하나: 데모 안내 띠에만 */
  --pastel:#FFF6DC; --pastel-line:#F3E3B5;
}
</style>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
ul,ol{list-style:none}
svg{display:block;flex:none}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
:focus-visible{outline:none;box-shadow:var(--ring)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--h-md);padding:0 16px;border-radius:var(--r-pill);font-size:14px;font-weight:600;white-space:nowrap;border:1px solid var(--line);background:var(--card);transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:var(--soft)}
.btn:active{background:var(--track)}
.btn:disabled{color:var(--mut-2);background:var(--soft);border-color:var(--line-2);cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn.primary:active{background:var(--brand-press)}
.btn.primary:disabled{background:var(--track);border-color:var(--track);color:var(--mut-2)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:#2B3440}
.btn.dark:disabled{background:#6B7480;border-color:#6B7480;color:#E5E8EB}
.btn.dark[aria-busy="true"]{background:#2B3440;border-color:#2B3440;color:#fff;cursor:progress}
.busy-dot{width:8px;height:8px;border-radius:50%;background:var(--ok-dot);flex:none;animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--track)}
.btn.lg{height:var(--h-lg);padding:0 20px;font-size:15px}
.btn.full{width:100%}
.btn.icon{width:40px;padding:0}

/* 칩 */
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--r-pill);font-size:12px;font-weight:600;white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok);background:var(--ok-bg)} .chip.ok i{background:var(--ok-dot)}
.chip.info{color:var(--info);background:var(--info-bg)} .chip.info i{background:var(--info-dot)}
.chip.warn{color:var(--warn);background:var(--warn-bg)} .chip.warn i{background:var(--warn-dot)}
.chip.bad{color:var(--bad);background:var(--bad-bg)} .chip.bad i{background:var(--bad-dot)}
.chip.neu{color:var(--neu);background:var(--neu-bg)} .chip.neu i{background:var(--neu-dot)}
.chip.type{color:var(--ink-2);background:var(--soft);border:1px solid var(--line-2)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* 카드 */
.card{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-lg)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.card-h h2{font-size:17px;font-weight:700;line-height:1.3}
.card-h .sub{font-size:13px;color:var(--mut)}

/* 세그먼트 */
.seg{display:inline-flex;padding:4px;background:var(--track);border-radius:var(--r-pill);gap:4px}
.seg button{height:32px;padding:0 14px;border-radius:var(--r-pill);font-size:13px;font-weight:600;color:var(--mut)}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--sh-pill)}

/* 스위치 */
.sw{display:inline-flex;align-items:center;gap:8px;min-height:40px;font-size:13px;color:var(--ink-2);font-weight:500}
.sw .k{position:relative;width:36px;height:20px;border-radius:var(--r-pill);background:#C9CFD6;transition:background .2s;flex:none}
.sw .k::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.2);transition:transform .2s}
.sw[aria-checked="true"] .k{background:var(--brand)}
.sw[aria-checked="true"] .k::after{transform:translateX(16px)}

/* 입력 */
.fld{display:flex;flex-direction:column;gap:8px}
.fld label,.fld .lb{font-size:13px;font-weight:600;color:var(--ink-2)}
.fld .req{color:var(--bad)}
.in{width:100%;height:var(--h-lg);padding:0 14px;border:1px solid var(--line);border-radius:var(--r-md);background:#fff;font-size:15px;transition:border-color .15s,box-shadow .15s}
.in::placeholder{color:var(--mut-2)}
.in:focus{outline:none;border-color:var(--brand);box-shadow:var(--ring)}
.in.err{border-color:var(--bad)}
textarea.in{height:auto;min-height:96px;padding:12px 14px;resize:vertical;line-height:1.5}
.help{font-size:13px;color:var(--mut)}
.err-t{font-size:13px;color:var(--bad);font-weight:500}

/* 데모 안내 띠 */
.strip{background:var(--pastel);border-bottom:1px solid var(--pastel-line)}
.strip-in{max-width:1248px;margin:0 auto;padding:8px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:56px}
.strip-t{font-size:13px;color:var(--ink-2);flex:1;min-width:220px}
.strip-t b{color:var(--warn);font-weight:700;margin-right:6px}
.strip-t .short{display:none}
.strip-b{display:flex;gap:8px;flex-wrap:wrap}

/* 위 내비 */
.top{background:var(--bg)}
.top-in{max-width:1248px;margin:0 auto;padding:16px 24px 0;display:flex;align-items:center;gap:24px}
.logo{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;color:var(--ink);text-decoration:none;white-space:nowrap}
.mark{width:32px;height:32px;border-radius:var(--r-sm);background:var(--brand);display:grid;place-items:center}
.mark svg{width:20px;height:20px}
.pills{display:flex;gap:4px;padding:4px;background:var(--track);border-radius:var(--r-pill)}
.pills button{height:36px;padding:0 16px;border-radius:var(--r-pill);font-size:14px;font-weight:600;color:var(--mut)}
.pills button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--sh-pill)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.plan{font-size:13px;color:var(--mut)}
.plan b{color:var(--ink-2);font-weight:600}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line-2);display:grid;place-items:center;color:var(--ink-2)}

.page{max-width:1248px;margin:0 auto;padding:16px 24px 48px}

/* 행사 머리 */
.ev{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:32px;padding:24px 24px 24px 32px}
.ev h1{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.25;margin-top:8px}
.ev .meta{font-size:14px;color:var(--mut);margin-top:4px}
.join{display:flex;align-items:center;gap:20px;padding:12px 24px 12px 12px;background:var(--soft);border-radius:var(--r-lg)}
.qr{background:#fff;border-radius:var(--r-md);padding:6px;border:1px solid var(--line-2)}
.qr svg{width:100%;height:100%}
.join .qr{width:112px;height:112px}
.join .lbl{font-size:13px;color:var(--mut);font-weight:500}
.code{font-size:44px;font-weight:700;letter-spacing:.02em;line-height:1.1;color:var(--ink)}
.join .help{margin-top:6px}
.ev-act{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.live{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);white-space:nowrap}
.live b{font-size:20px;color:var(--ink);font-weight:700;margin-right:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok-dot);position:relative}
.dot.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ok-dot);opacity:0;animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.6);opacity:0}}

/* 진행 화면 3단 */
.grid{display:grid;grid-template-columns:264px minmax(0,1fr) 360px;gap:16px;margin-top:16px;align-items:start}
.acts{padding:20px 16px 16px}
.acts .card-h{padding:0 8px}
.act-list{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.act{width:100%;display:flex;align-items:flex-start;gap:12px;padding:12px;border-radius:var(--r-md);text-align:left;transition:background .15s}
.act:hover{background:var(--soft)}
.act[aria-current="true"]{background:var(--brand-tint)}
.act .a-ic{width:32px;height:32px;border-radius:var(--r-sm);background:var(--soft);display:grid;place-items:center;color:var(--ink-2)}
.act[aria-current="true"] .a-ic{background:var(--brand);color:#fff}
.act .a-t{flex:1;min-width:0}
.act .a-ty{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);font-weight:500}
.act .a-ty i{width:6px;height:6px;border-radius:50%;background:var(--neu-dot)}
.act .a-ty i.live{background:var(--info-dot)}
.act .a-ty i.done{background:var(--ok-dot)}
.act .a-ti{display:block;font-size:14px;font-weight:600;line-height:1.4;margin-top:2px;color:var(--ink)}
.act .a-n{font-size:13px;color:var(--mut);font-weight:600;padding-top:2px}
.act-empty{padding:16px 8px;font-size:13px;color:var(--mut)}

.res{padding:24px 28px 24px}
.res-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.res-title{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.3;margin-top:12px}
.res-total{display:flex;align-items:baseline;gap:2px;margin:12px 0 20px;color:var(--mut);font-size:14px}
.res-total b{font-size:32px;font-weight:700;color:var(--ink);line-height:1}
.res-total .rate{margin-left:8px}
.res-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:24px;padding-top:16px;border-top:1px solid var(--line-2)}
.demo-hint{background:var(--pastel);border:1px solid var(--pastel-line);border-radius:var(--r-md);padding:12px 16px;font-size:13px;color:var(--ink-2);margin:-4px 0 20px}
.demo-hint b{font-weight:700;color:var(--ink)}
.res-f .next{margin-left:auto;font-size:13px;color:var(--mut);display:flex;align-items:center;gap:8px;min-width:0}
.res-f .next span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.swap{animation:swap .4s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:40px 16px}
.empty .e-ic{width:48px;height:48px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--mut);margin-bottom:4px}
.empty b{font-size:15px;font-weight:600}
.empty p{font-size:13px;color:var(--mut);max-width:320px}
.empty .btn{margin-top:8px}

/* 막대 */
.bars{display:flex;flex-direction:column;gap:14px}
.br-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.br-lab{font-size:15px;font-weight:500;display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;min-width:0}
.br-val{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.br-pct{font-size:17px;font-weight:700}
.br-cnt{font-size:13px;color:var(--mut);min-width:40px;text-align:right}
.track{height:24px;background:var(--soft);border-radius:10px;overflow:hidden}
.fill{height:100%;width:0;background:var(--brand-tint-2);border-radius:10px;transition:width .7s cubic-bezier(.2,.8,.2,1),background .3s}
.bar-row.lead .fill{background:var(--brand)}
.bar-row.correct .fill{background:var(--ok-dot)}
.bar-row.dim .fill{background:var(--track)}
.bar-row.dim .br-lab,.bar-row.dim .br-pct{color:var(--mut)}
.tag{font-size:12px;font-weight:600;height:22px;padding:0 8px;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:4px;flex:none;white-space:nowrap}
.tag.ok{color:var(--ok);background:var(--ok-bg)}
.tag.me{color:var(--brand-text);background:var(--brand-tint)}
.bars.sm{gap:14px}
.bars.sm .br-lab{font-size:14px}
.bars.sm .br-pct{font-size:15px}
.bars.sm .track{height:12px;border-radius:6px}
.bars.sm .fill{border-radius:6px}
.bars.lg{gap:24px}
.bars.lg .br-lab{font-size:24px;font-weight:600}
.bars.lg .br-pct{font-size:32px}
.bars.lg .br-cnt{font-size:17px;min-width:56px}
.bars.lg .track{height:44px;border-radius:12px}
.bars.lg .fill{border-radius:12px}

/* 워드클라우드 */
.cloud{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;align-content:center;gap:6px 18px;min-height:220px;padding:16px 8px;background:var(--soft);border-radius:var(--r-lg)}
.cloud .w{font-weight:700;line-height:1.15;color:var(--ink-2);transition:font-size .45s cubic-bezier(.2,.8,.2,1),color .3s}
.cloud .cbr{flex-basis:100%;height:0}
.cloud .w[data-l="1"]{font-size:14px;color:var(--mut);font-weight:600}
.cloud .w[data-l="2"]{font-size:17px}
.cloud .w[data-l="3"]{font-size:20px}
.cloud .w[data-l="4"]{font-size:24px;color:var(--ink)}
.cloud .w[data-l="5"]{font-size:32px;color:var(--ink)}
.cloud .w[data-l="6"]{font-size:44px;color:var(--brand)}
.cloud .w.pop{animation:pop .45s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.cloud.sm{min-height:140px;gap:4px 12px}
.cloud.sm .w[data-l="1"]{font-size:13px} .cloud.sm .w[data-l="2"]{font-size:14px} .cloud.sm .w[data-l="3"]{font-size:15px}
.cloud.sm .w[data-l="4"]{font-size:17px} .cloud.sm .w[data-l="5"]{font-size:20px} .cloud.sm .w[data-l="6"]{font-size:24px}
.cloud.lg{min-height:420px;gap:8px 28px}
.cloud.lg .w[data-l="1"]{font-size:17px} .cloud.lg .w[data-l="2"]{font-size:20px} .cloud.lg .w[data-l="3"]{font-size:24px}
.cloud.lg .w[data-l="4"]{font-size:32px} .cloud.lg .w[data-l="5"]{font-size:44px} .cloud.lg .w[data-l="6"]{font-size:44px}
.cloud-empty{font-size:13px;color:var(--mut);text-align:center;order:350}

/* Q&A */
.qa{padding:20px 20px 12px;display:flex;flex-direction:column;max-height:calc(100vh - 32px);position:sticky;top:16px}
.qa .card-h{margin-bottom:12px}
.qa-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.qlist{overflow:auto;margin:0 -8px;padding:0 8px;min-height:120px}
.q{display:flex;gap:12px;padding:14px 4px;border-top:1px solid var(--line-2)}
.q:first-child{border-top:0}
.q.new{animation:qin .5s cubic-bezier(.2,.8,.2,1)}
@keyframes qin{0%{opacity:0;transform:translateY(-6px);background:var(--brand-tint)}100%{opacity:1;transform:none;background:transparent}}
.q-main{flex:1;min-width:0}
.q-t{font-size:14px;line-height:1.5;color:var(--ink)}
.q-m{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.q.answered .q-t{color:var(--mut)}
.q-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.likes{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--ink-2);height:28px;padding:0 10px;border-radius:var(--r-pill);background:var(--soft)}
.likes.hot{color:var(--brand-text);background:var(--brand-tint)}
.bump{animation:bump .42s cubic-bezier(.2,.8,.2,1)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
.q-btns{display:flex;gap:4px}
.ibtn{width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--mut);transition:background .15s,color .15s}
.ibtn:hover{background:var(--track);color:var(--ink)}
.ibtn[aria-pressed="true"]{color:var(--ok);background:var(--ok-bg)}
@media (hover:hover) and (min-width:861px){.qa .q .q-btns{opacity:0;transition:opacity .15s}.qa .q:hover .q-btns,.qa .q:focus-within .q-btns,.qa .pend .q-btns{opacity:1}}
.pend{background:var(--warn-bg);border-radius:var(--r-md);padding:12px;margin-bottom:8px}
.pend-h{font-size:12px;font-weight:700;color:var(--warn);margin-bottom:4px}
.pend .q{border-top-color:rgba(122,86,0,.12);padding:10px 0}
.pend .q:first-of-type{border-top:0}
.mini{height:32px;padding:0 12px;font-size:13px}

/* 리포트 */
.rep-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:8px 0 20px}
.rep-h h1{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.rep-h p{font-size:14px;color:var(--mut);margin-top:4px}
.kpis{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:16px}
.kpi{padding:20px 24px}
.kpi .k-l{font-size:14px;color:var(--mut);font-weight:500}

.ra-h b{font-size:15px;font-weight:600}
.ra-h span{font-size:13px;color:var(--mut);white-space:nowrap}
.ra .words{display:flex;flex-wrap:wrap;gap:8px}
.ra .words span{font-size:13px;padding:4px 10px;border-radius:var(--r-pill);background:var(--soft);color:var(--ink-2)}
.ra .words b{font-weight:700;color:var(--ink);margin-left:4px}
.rep-q{padding:24px}
.rq{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line-2)}
.card-h+.rq{border-top:0}

.rq .likes{flex:none}
.note{font-size:13px;color:var(--mut);margin-top:16px}

/* 내 행사 */
.evs{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:16px;margin-top:8px;align-items:start}
.evs-list{padding:24px}
.erow{display:grid;grid-template-columns:minmax(0,1fr) 156px 64px 80px;gap:12px;align-items:center;padding:16px 0;border-top:1px solid var(--line-2);font-size:14px}
.erow.head{font-size:13px;color:var(--mut);border-top:0;padding:0 0 10px}
.erow .en b{display:block;font-size:15px;font-weight:600}
.erow .en span{font-size:13px;color:var(--mut)}
.erow .r{text-align:right}
.ev-form{padding:24px;display:flex;flex-direction:column;gap:20px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* 모달 */
.modal{position:fixed;inset:0;background:rgba(25,31,40,.42);display:grid;place-items:center;padding:16px;z-index:50}
.panel{background:#fff;border-radius:var(--r-xl);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:28px;box-shadow:var(--sh-pop)}
.panel h2{font-size:20px;font-weight:700;margin-bottom:20px}
.panel form{display:flex;flex-direction:column;gap:20px}
.type-chips{display:flex;gap:8px;flex-wrap:wrap}
.tc{height:40px;padding:0 16px;border-radius:var(--r-pill);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px}
.tc[aria-checked="true"]{border-color:var(--brand);background:var(--brand-tint);color:var(--brand-text)}
.optrow{display:flex;gap:8px;align-items:center}
.optrow .in{flex:1}
.optrow .cor{height:var(--h-lg);padding:0 12px;border-radius:var(--r-md);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mut);white-space:nowrap}
.optrow .cor[aria-checked="true"]{border-color:var(--ok-dot);background:var(--ok-bg);color:var(--ok)}
.opts{display:flex;flex-direction:column;gap:8px}
.panel-f{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}

/* 발표 화면 */
.present{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding:24px 40px 32px;overflow:auto}

.pr-top .btn{margin-left:auto}

.pr-main{padding:40px 48px}
.pr-title{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1.25;margin:16px 0 8px}
.pr-total{font-size:17px;color:var(--mut);margin-bottom:32px}
.pr-total b{color:var(--ink);font-size:24px;margin-right:2px}
.pr-side{display:flex;flex-direction:column;gap:24px;align-self:start;min-width:0}
.pr-join{padding:32px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.pr-join .qr{width:240px;height:240px;padding:10px;margin-bottom:12px}
.pr-join .lbl{font-size:15px;color:var(--mut)}
.pr-join .live{margin-top:12px;font-size:15px}
.pr-qa{padding:24px 24px 12px}
.pr-qa .card-h{margin-bottom:4px}
.prq{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line-2)}
.prq:first-child{border-top:0}
.prq p{flex:1;font-size:15px;line-height:1.45;font-weight:500}
.prq .likes{flex:none}

@media (max-height:960px){.pr-join{padding:24px}.pr-join .qr{width:184px;height:184px;margin-bottom:4px}.pr-join .code{font-size:32px}}

/* 토스트 */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;background:var(--ink);color:#fff;font-size:14px;font-weight:500;padding:12px 20px;border-radius:var(--r-md);box-shadow:var(--sh-pop);z-index:60;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
body.pmode .toast{bottom:auto;top:16px;transform:translate(-50%,-16px)}
body.pmode .toast.on{transform:translate(-50%,0)}

.foot{max-width:1248px;margin:0 auto;padding:0 24px 40px;font-size:13px;color:var(--mut)}

/* ===== 참여자 화면 (휴대폰) ===== */
.p{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}

.p-top .mark{width:36px;height:36px}
.p-top .pt{flex:1;min-width:0}
.p-ev{font-size:17px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-code{font-size:13px;color:var(--mut)}

.p-main{padding:12px 16px 24px;flex:1}
.p-card{padding:20px}
.p-q{font-size:20px;font-weight:700;line-height:1.35;letter-spacing:-.01em;margin:12px 0 20px}
.opt{width:100%;min-height:56px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r-md);background:#fff;text-align:left;font-size:15px;font-weight:500;transition:border-color .15s,background .15s}
.opt+.opt{margin-top:8px}
.opt .rd{width:22px;height:22px;border-radius:50%;border:2px solid #C9CFD6;flex:none;display:grid;place-items:center;transition:border-color .15s}

.opt[aria-checked="true"] .rd{border-color:var(--brand)}
.opt[aria-checked="true"] .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand);animation:dotin .22s cubic-bezier(.2,.8,.2,1)}
@keyframes dotin{0%{transform:scale(0)}100%{transform:scale(1)}}
.opt{transition:border-color .15s,background .15s,transform .12s}
.opt:active{transform:scale(.985)}
.cta:not(:disabled):active{transform:scale(.98)}
.p-done{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.p-sub{font-size:13px;color:var(--mut);margin-top:16px}

.p-cta .hint{font-size:13px;color:var(--mut);text-align:center;margin-bottom:8px}
.cta{width:100%;height:var(--h-cta);border-radius:var(--r-md);font-size:17px;font-weight:700}
.cloud-in{display:flex;gap:8px}

.mywords{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.compose .cnt{font-size:12px;color:var(--mut)}
.compose .in.nm{height:44px;font-size:14px}
.compose .btn{margin-top:12px;height:var(--h-lg);border-radius:var(--r-md);font-size:15px}
.p-qhead{display:flex;align-items:center;justify-content:space-between;margin:20px 0 4px}
.p-qhead b{font-size:15px}
.p-ql .q{padding:16px 0}
.like{min-width:64px;height:44px;border-radius:var(--r-pill);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;color:var(--ink-2);padding:0 12px;transition:background .15s,border-color .15s,color .15s}
.like[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-tint);color:var(--brand-text)}
.like:active{transform:scale(.96)}
.p-foot{font-size:12px;color:var(--mut);padding:24px 8px 0;text-align:center}
.p-join{padding:32px 16px}
.p-join h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:24px 0 4px}
.p-join .codein{height:64px;font-size:32px;font-weight:700;text-align:center;letter-spacing:.2em;border-radius:var(--r-md);margin-top:24px}
.p-join .demo-code{margin-top:12px;height:44px;padding:0 16px;font-size:14px;color:var(--brand-text);background:var(--brand-tint);border-color:var(--brand-tint)}
.p-join .demo-code:hover{background:var(--brand-tint-2)}
.skel{height:16px;border-radius:8px;background:linear-gradient(90deg,var(--track),var(--soft),var(--track));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* ===== 진행자 + 참여자 휴대폰 미리보기 ===== */
.hwrap{display:flex;align-items:flex-start;min-height:100vh}
.hm{flex:1;min-width:0;container:hm/inline-size}
.dock{position:sticky;top:0;height:100vh;width:372px;flex:none;border-left:1px solid var(--line-2);display:flex;flex-direction:column;align-items:center;padding:16px 24px 16px;gap:12px;overflow:hidden}
.dk-h{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
.dk-h b{display:block;font-size:15px;font-weight:700;line-height:1.3}
.dk-h span{display:block;font-size:13px;color:var(--mut)}
.dk-h .btn.icon{width:44px;height:44px;flex:none}
.phone{--ps:.84;background:#fff;border:1px solid var(--line);border-radius:44px;padding:10px;box-shadow:var(--sh-pop);flex:none}
.phone .scr{width:calc(360px * var(--ps));height:calc(780px * var(--ps));border-radius:34px;overflow:hidden;background:var(--bg);position:relative}
.phone iframe{width:360px;height:780px;border:0;display:block;transform:scale(var(--ps));transform-origin:0 0}
.dk-f{font-size:12px;color:var(--mut);text-align:center;max-width:300px;line-height:1.5}
@media (max-width:1279px){.dock,#bDock{display:none!important}}
@container hm (max-width:1180px){
  .grid{grid-template-columns:260px minmax(0,1fr)}
  .qa{grid-column:1/-1;position:static;max-height:none}
  .ev{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"main join" "act join";row-gap:20px}

  .ev-act{grid-area:act;flex-direction:row;justify-content:flex-start;align-items:center;gap:24px;align-self:start}
  .strip-t .long{display:none}
  .strip-t .short{display:inline}
}

/* ===== 반응형 ===== */
@media (max-width:860px){
  .top-in{flex-wrap:wrap;gap:12px;padding:12px 16px 0}
  .top-r .plan{display:none}
  .pills{order:3;width:100%}
  .pills button{flex:1;padding:0 8px;height:44px}
  .logo{min-height:44px}
  .strip-in{padding:10px 0 12px;gap:8px;min-height:0}
  .strip-t{padding:0 16px;flex-basis:100%;min-width:0}
  .strip-t .long{display:none}
  .strip-t .short{display:inline}
  .strip-b{flex-wrap:nowrap;width:100%;overflow-x:auto;padding:0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .strip-b::-webkit-scrollbar{display:none}
  .strip-b .btn{flex:none}
  .page{padding:12px 16px 40px}
  .ev{grid-template-columns:1fr;grid-template-areas:"main" "join" "act";gap:16px;padding:20px}
  .ev-main{align-self:auto}
  .ev-act{justify-content:space-between;gap:12px}
  .ev h1{font-size:24px}
  .join{padding:12px 16px 12px 12px;gap:16px}
  .join .qr{width:96px;height:96px}
  .code{font-size:32px}
  .grid{grid-template-columns:1fr;gap:12px;margin-top:12px}
  .res{order:-1;padding:20px}
  .res-title{font-size:20px}
  .res-f .next{margin-left:0;width:100%}
  .kpis{grid-template-columns:1fr 1fr;gap:12px}
  .kpi{padding:16px}
  .kpi .k-v{font-size:24px}
  .rep-grid,.evs{grid-template-columns:1fr;gap:12px}
  .rep-h h1{font-size:24px}
  .erow{grid-template-columns:minmax(0,1fr) auto;row-gap:4px}
  .erow.head{display:none}
  .erow .c-date{display:none}
  .erow .c-n{grid-column:1;grid-row:2;text-align:left;font-size:13px;color:var(--mut)}
  .erow .c-st{grid-column:2;grid-row:1/3;text-align:right}
  .present{padding:16px}
  .pr-body{grid-template-columns:1fr;align-items:start;flex:none}
  .pr-main{padding:24px 20px}
  .pr-title{font-size:24px}
  .bars.lg .br-lab{font-size:17px}
  .bars.lg .br-pct{font-size:20px}
  .bars.lg .track{height:28px}
  .pr-side{gap:16px}
  .pr-join{flex-direction:row;text-align:left;padding:16px;gap:16px}
  .pr-qa{padding:20px 20px 8px}

  .foot{padding:0 16px 32px}
  .btn,.seg button{min-height:44px}
  .seg button{height:auto}
  .ibtn{width:44px;height:44px}
  .sw{min-height:44px}
  .act{min-height:56px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<script>
(function(){
'use strict';

/* ---------- 작은 도구 ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,10);
const ic=(n,cls)=>`<svg class="ic ${cls||''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const fmtN=n=>Number(n).toLocaleString('ko-KR');
const fmtCode=c=>String(c).replace(/^(\d{3})(\d{3})$/,'$1 $2');
const REDUCED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const TYPE={poll:'설문',quiz:'퀴즈',cloud:'워드클라우드'};
const DAYS='일월화수목금토';
function fmtDate(ev){
  const d=new Date(ev.date+'T00:00:00');
  if(isNaN(d))return ev.date;
  return `${d.getMonth()+1}월 ${d.getDate()}일(${DAYS[d.getDay()]})`+(ev.time?' '+ev.time:'');
}
function ago(ts){
  const s=Math.max(0,Math.round((Date.now()-ts)/1000));
  if(s<50)return '방금';
  const m=Math.round(s/60); if(m<60)return m+'분 전';
  return Math.round(m/60)+'시간 전';
}
function tweenNum(el,to,suffix){
  if(!el)return;
  suffix=suffix||'';
  const from=+(el.dataset.v||0);
  el.dataset.v=to;
  if(from===to||REDUCED){el.textContent=fmtN(to)+suffix;return;}
  const t0=performance.now(),dur=600;
  cancelAnimationFrame(el._raf);
  const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);
    el.textContent=fmtN(Math.round(from+(to-from)*e))+suffix;

    const n=ver*4+17,M=[],F=[];for(let y=0;y<n;y++){M.push(new Array(n).fill(false));F.push(new Array(n).fill(false));}

  }

const IS_JOIN=/^#join/.test(location.hash);

const bus={
  ch:null,seen:new Set(),fns:[],
  init(){
    try{this.ch=new BroadcastChannel('sonbeonjjeok-demo-v1');this.ch.onmessage=e=>this.got(e.data);}catch(e){}
    addEventListener('storage',e=>{if(e.key==='sbj-bus'&&e.newValue){try{this.got(JSON.parse(e.newValue));}catch(_){}}});
  },
  got(m){if(!m||!m.mid||this.seen.has(m.mid)||m.from===CLIENT)return;this.seen.add(m.mid);this.fns.forEach(f=>f(m));},
  on(f){this.fns.push(f);},
  send(m){m.mid=rid();m.from=CLIENT;this.seen.add(m.mid);
    try{this.ch&&this.ch.postMessage(m);}catch(e){}
    try{localStorage.setItem('sbj-bus',JSON.stringify(m));}catch(e){}}
};

/* 참여자 행동을 상태에 반영 (진행자 탭과 혼자 보기 모드가 같이 씀) */
function applyAct(S,from,a){
  const ac=S.activities.find(x=>x.id===a.aid);
  switch(a.kind){
    case 'join':S.joined[from]=1;break;
    case 'vote':
      if(!ac||ac.type==='cloud'||ac.closed||ac.state!=='live'||ac.voters[from])return false;
      if(!ac.options.some(o=>o.id===a.oid))return false;
      ac.voters[from]=a.oid;ac.votes[a.oid]=(ac.votes[a.oid]||0)+1;S.joined[from]=1;break;
    case 'word':{
      if(!ac||ac.type!=='cloud'||ac.closed||ac.state!=='live')return false;
      const w=normWord(a.word);if(!w)return false;
      const mine=ac.voters[from]||(ac.voters[from]=[]);
      if(mine.length>=3||mine.includes(w))return false;
      mine.push(w);ac.words[w]=(ac.words[w]||0)+1;S.joined[from]=1;break;}
    case 'ask':{
      const t=String(a.text||'').trim().slice(0,200);if(t.length<2)return false;
      if(S.questions.some(q=>q.id===a.qid))return false;
      S.questions.push({id:a.qid||rid(),text:t,name:String(a.name||'').trim().slice(0,12)||'익명',likes:0,likers:{},ts:a.ts||Date.now(),status:S.event.moderate?'pending':'open',by:from});
      S.joined[from]=1;break;}
    case 'like':{
      const q=S.questions.find(x=>x.id===a.qid);if(!q||q.status==='pending')return false;
      if(q.likers[from]){delete q.likers[from];q.likes--;}else{q.likers[from]=1;q.likes++;}
      break;}
    default:return false;
  }
  S.rev++;return true;
}

/* ---------- 결과 화면 (막대·워드클라우드) ---------- */
class ResultView{
  constructor(root,size){this.root=root;this.size=size||'md';this.key=null;this.rows=new Map();this.words=new Map();}
  update(ac,mine){
    if(!ac){if(this.key!=='none'){this.root.innerHTML='';this.key='none';}return;}
    const key=ac.id+'|'+ac.type+'|'+(ac.options?ac.options.map(o=>o.id+':'+o.label).join(','):'');
    if(key!==this.key){this.key=key;this.build(ac);requestAnimationFrame(()=>requestAnimationFrame(()=>this.fill(ac,mine)));}
    else this.fill(ac,mine);
  }
  build(ac){
    this.rows.clear();this.words.clear();
    if(ac.type==='cloud'){
      this.root.innerHTML=`<div class="cloud ${this.size}" aria-live="polite"><p class="cloud-empty">아직 보낸 단어가 없어요</p><i class="cbr" style="order:200"></i><i class="cbr" style="order:400"></i></div>`;
      this.cloud=this.root.firstChild;this.cEmpty=this.cloud.firstChild;return;
    }
    this.root.innerHTML=`<ol class="bars ${this.size}">`+ac.options.map(o=>`<li class="bar-row" data-o="${esc(o.id)}"><div class="br-top"><span class="br-lab"><span>${esc(o.label)}</span></span><span class="br-val"><b class="num br-pct" data-v="0">0%</b><span class="num br-cnt" data-v="0">0명</span></span></div><div class="track"><div class="fill"></div></div></li>`).join('')+'</ol>';
    $$('.bar-row',this.root).forEach(r=>this.rows.set(r.dataset.o,{r,lab:$('.br-lab',r),fill:$('.fill',r),pct:$('.br-pct',r),cnt:$('.br-cnt',r)}));
  }
  fill(ac,mine){
    if(ac.type==='cloud')return this.fillCloud(ac);
    const tot=ac.options.reduce((s,o)=>s+(ac.votes[o.id]||0),0);
    let lead=null,max=0;ac.options.forEach(o=>{const v=ac.votes[o.id]||0;if(v>max){max=v;lead=o.id;}});
    const reveal=ac.type==='quiz'&&ac.revealed;
    ac.options.forEach(o=>{
      const x=this.rows.get(o.id);if(!x)return;
      const v=ac.votes[o.id]||0,p=tot?Math.round(v/tot*100):0;
      x.fill.style.width=(tot?v/tot*100:0)+'%';
      x.r.classList.toggle('lead',!reveal&&o.id===lead&&max>0);
      x.r.classList.toggle('correct',reveal&&o.id===ac.correct);
      x.r.classList.toggle('dim',reveal&&o.id!==ac.correct);
      let tags='';
      if(reveal&&o.id===ac.correct)tags+=`<span class="tag ok">${ic('check','sm')}정답</span>`;
      if(mine&&mine===o.id)tags+='<span class="tag me">내 선택</span>';
      const want=`<span>${esc(o.label)}</span>${tags}`;
      if(x.lab._h!==want){x.lab.innerHTML=want;x.lab._h=want;}
      tweenNum(x.pct,p,'%');tweenNum(x.cnt,v,'명');
    });
  }
  fillCloud(ac){
    const en=Object.entries(ac.words).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ko'));
    this.cEmpty.hidden=en.length>0;
    const max=en.length?en[0][1]:1;
    en.forEach(([w,c],rank)=>{
      let el=this.words.get(w);
      if(!el){el=document.createElement('span');el.className='w pop';el.textContent=w;this.cloud.appendChild(el);this.words.set(w,el);setTimeout(()=>el.classList.remove('pop'),500);}
      const r=c/max,l=rank===0?6:r>.75?5:r>.5?4:r>.3?3:r>.15?2:1;
      let ord;
      if(rank<5)ord=350+[0,-1,1,-2,2][rank]*10;
      else{const k=rank-5,j=Math.floor(k/2);ord=(k%2===0?150:550)+(j%2?j:-j);}
      el.dataset.l=l;el.style.order=ord;el.title=c+'명';el.setAttribute('aria-label',w+' '+c+'명');
    });
  }
}

    if(ac.type==='cloud'){act(id,{kind:'word',aid:ac.id,word:pickW(POOL_W)});if(Math.random()<.35)later(()=>act(id,{kind:'word',aid:ac.id,word:pickW(POOL_W)}),900+Math.random()*1500);return;}

  function standaloneSeed(){

    for(let i=1;i<=23;i++)ids.push('ex-'+i);
    ids.forEach(id=>applyAct(s,id,{kind:'join'}));
    ids.forEach((id,i)=>{const w=[42,31,17,10];applyAct(s,id,{kind:'vote',aid:'a1',oid:pickW(a1.options.map((o,j)=>[o.id,w[j]]))});});
    [[0,9],[3,6],[1,4],[6,2]].forEach(([qi,likes],k)=>{const qid='ex-q'+k;applyAct(s,'ex-'+(k+1),{kind:'ask',qid,text:POOL_Q[qi][0],name:POOL_Q[qi][1],ts:Date.now()-(k+2)*95000});for(let j=0;j<likes;j++)applyAct(s,'ex-'+(j+5),{kind:'like',qid});});
    return s;
  }

  const likesT=likeTracker();
  let lastRejoin=0;
  bus.on(m=>{
    if(m.t!=='state'||!m.S)return;
    if(standalone)stopAuto();
    S=m.S;synced=true;standalone=false;
    pending=pending.filter(a=>!S.acks.includes(a.mid));
    pending.forEach(a=>applyAct(S,CLIENT,a));
    /* 진행자가 '처음 상태로'를 눌러도 열려 있던 휴대폰은 다시 참여자로 세요 */
    if(built&&!S.joined[CLIENT]&&Date.now()-lastRejoin>3000){lastRejoin=Date.now();act({kind:'join'});return;}
    render();
  });
  function hello(){bus.send({t:'hello'});}
  hello();
  const helloT=setInterval(()=>{if(synced){clearInterval(helloT);return;}hello();},2500);
  setTimeout(()=>{if(!synced){S=standaloneSeed();standalone=true;render();startAuto();}},900);

  function act(a){
    a.mid=rid();
    if(synced){pending.push(a);applyAct(S,CLIENT,a);bus.send({t:'act',act:a});}
    else{applyAct(S,CLIENT,a);if(standalone)autoReact(a);}
    render();
  }

  /* ---------- 혼자 보기: 진행자 화면 없이 휴대폰만 열었을 때 ----------
     다른 참여자 응답과 진행 순서를 예시로 흉내 내요. 진행자 화면이 연결되면 바로 멈춰요. */
  let autoT=[],trickleT=null,exN=23,ticks=0;
  function alater(fn,ms){const t=setTimeout(()=>{autoT=autoT.filter(x=>x!==t);if(standalone&&S)fn();},ms);autoT.push(t);}
  function stopAuto(){autoT.forEach(clearTimeout);autoT=[];clearTimeout(trickleT);trickleT=null;}
  function exVoter(ac){
    const cand=[];for(let i=1;i<=exN;i++){const id='ex-'+i;if(!ac.voters[id])cand.push(id);}
    if(cand.length&&(exN>=46||Math.random()<.8))return cand[Math.floor(Math.random()*cand.length)];
    if(exN<46){exN++;const id='ex-'+exN;applyAct(S,id,{kind:'join'});return id;}
    return null;
  }
  function exRespond(ac){
    const id=exVoter(ac);if(!id)return false;
    if(ac.type==='cloud')return applyAct(S,id,{kind:'word',aid:ac.id,word:pickW(POOL_W)});
    const w=WEIGHTS[ac.id]||ac.options.map(()=>1);
    return applyAct(S,id,{kind:'vote',aid:ac.id,oid:pickW(ac.options.map((o,j)=>[o.id,w[j]||5]))});
  }
  function exTick(){
    const ac=activeOf(S),r=Math.random();
    if(ac&&ac.state==='live'&&!ac.closed&&r<.55&&exRespond(ac))return;
    const qs=S.questions.filter(q=>q.status==='open');
    if(r<.9&&qs.length){const q=pickQ(qs);
      const id='ex-'+(1+Math.floor(Math.random()*exN));if(!q.likers[id])applyAct(S,id,{kind:'like',qid:q.id});return;}
    const asked=new Set(S.questions.map(q=>q.text)),next=POOL_Q.find(q=>!asked.has(q[0]));
    if(next)applyAct(S,'ex-'+(1+Math.floor(Math.random()*exN)),{kind:'ask',qid:'ex-q'+rid(),text:next[0],name:next[1]});
  }
  function startAuto(){
    const loop=()=>{trickleT=setTimeout(()=>{if(!standalone||!S)return;exTick();render();if(++ticks<140)loop();},900+Math.random()*1300);};
    loop();
  }
  function goLive(aid,burst){
    const prev=activeOf(S),ac=S.activities.find(a=>a.id===aid);if(!ac)return;
    if(prev&&prev!==ac)prev.state='done';
    ac.state='live';S.activeId=aid;S.rev++;
    for(let i=0;i<burst;i++)exRespond(ac);
    render();
  }
  function autoReact(a){
    const ac=S.activities.find(x=>x.id===a.aid);
    if(a.kind==='vote'&&ac&&ac.type==='poll')alater(()=>goLive('a2',7),6000);
    if(a.kind==='vote'&&ac&&ac.type==='quiz')alater(()=>{ac.closed=true;ac.revealed=true;S.rev++;render();toast('진행자가 정답을 공개했어요');alater(()=>goLive('a3',9),7000);},3800);
  }

  /* 뼈대 */
  function shell(){
    app.innerHTML=`<div class="p">
      <div class="p-band">제안용 데모 · 예시</div>
      <header class="p-top">
        <span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-mark"/></svg></span>
        <div class="pt"><p class="p-ev" id="pEv"></p><p class="p-code">참여 코드 <span class="num" id="pCode"></span><span aria-hidden="true"> · </span><span class="num" id="pPc"></span>명 참여 중</p></div>
        <span id="pMode"></span>
      </header>
      <div class="seg p-seg" role="tablist" aria-label="참여 메뉴">
        <button role="tab" data-pt="vote" aria-selected="true">투표</button>
        <button role="tab" data-pt="qa" aria-selected="false">Q&amp;A<span class="cnt num" id="pQn"></span></button>
      </div>
      <main class="p-main">
        <section id="pVote"></section>
        <section id="pQa" hidden>
          <form class="card compose" id="qForm" novalidate>
            <label class="sr" for="qText">진행자에게 질문하기</label>
            <textarea class="in" id="qText" maxlength="200" placeholder="진행자에게 궁금한 점을 적어 주세요"></textarea>
            <div class="row"><span class="help" id="qHelp">이름을 비우면 익명으로 올라가요</span><span class="cnt num" id="qCnt">0/200</span></div>
            <input class="in nm" id="qName" maxlength="12" placeholder="이름 (선택)" autocomplete="off" aria-label="이름 (선택)" style="margin-top:8px">
            <p class="err-t" id="qErr" hidden style="margin-top:8px">질문을 2자 이상 적어 주세요</p>
            <button class="btn primary full" type="submit">질문 보내기</button>
          </form>
          <div class="p-qhead"><b>참여자 질문</b><div class="seg" role="tablist" aria-label="질문 정렬"><button data-ps="hot" aria-selected="true">인기순</button><button data-ps="new" aria-selected="false">최신순</button></div></div>
          <div class="p-ql" id="pQl"></div>
        </section>
        <p class="p-foot" id="pFoot"></p>
      </main>
      <div class="p-cta" id="pCta" hidden><p class="hint" id="pHint"></p><button class="btn primary cta" id="pSubmit" disabled>투표하기</button></div>
    </div>`;
    $$('[data-pt]').forEach(b=>b.onclick=()=>{ptab=b.dataset.pt;$$('[data-pt]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));render();window.scrollTo(0,0);});
    $$('[data-ps]').forEach(b=>b.onclick=()=>{qaSort=b.dataset.ps;$$('[data-ps]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));renderQa();});
    const t=$('#qText');
    t.oninput=()=>{$('#qCnt').textContent=t.value.length+'/200';if(t.value.trim().length>=2){$('#qErr').hidden=true;t.classList.remove('err');}};
    $('#qForm').onsubmit=e=>{
      e.preventDefault();
      const v=t.value.trim();
      if(v.length<2){$('#qErr').hidden=false;t.classList.add('err');t.focus();return;}
      act({kind:'ask',qid:'q'+rid(),text:v,name:$('#qName').value});
      t.value='';$('#qCnt').textContent='0/200';
      toast(S.event.moderate?'질문을 보냈어요 · 진행자가 확인한 뒤 공개돼요':'질문을 보냈어요');
    };
    $('#pVote').onclick=e=>{
      const o=e.target.closest('[data-opt]');
      if(o){const ac=activeOf(S);sel[ac.id]=o.dataset.opt;$$('[data-opt]').forEach(x=>x.setAttribute('aria-checked',String(x===o)));updateCta(ac);}
    };
    $('#pSubmit').onclick=()=>{
      const ac=activeOf(S);if(!ac||!sel[ac.id])return;
      const b=$('#pSubmit');b.disabled=true;b.textContent='보내는 중…';
      try{const ua=navigator.userActivation;if(navigator.vibrate&&(!ua||ua.isActive))navigator.vibrate(12);}catch(_){}
      setTimeout(()=>{act({kind:'vote',aid:ac.id,oid:sel[ac.id]});toast(ac.type==='quiz'?'답을 보냈어요':'투표했어요');},350);
    };
    $('#pQl').onclick=e=>{const b=e.target.closest('[data-like]');if(b)act({kind:'like',qid:b.dataset.like});};
  }

  function entryScreen(err){
    app.innerHTML=`<div class="p"><div class="p-band">제안용 데모 · 예시</div>
      <form class="p-join" id="jForm" novalidate>
        <span class="mark" style="width:44px;height:44px"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:26px;height:26px"><use href="#i-mark"/></svg></span>
        <h1>참여 코드를 입력해요</h1>
        <p class="help">진행자 화면에 보이는 6자리 숫자예요. QR을 찍으면 코드 없이 바로 들어와요.</p>
        <input class="in codein num" id="jCode" inputmode="numeric" maxlength="6" placeholder="000000" aria-label="참여 코드 6자리" autocomplete="off">
        <p class="err-t" id="jErr" ${err?'':'hidden'} style="margin-top:8px">${esc(err||'')}</p>
        <button class="btn primary cta" style="margin-top:16px" type="submit">들어가기</button>
        <button class="btn demo-code num" type="button" id="jDemo">데모 코드 ${fmtCode(S?S.event.code:'482913')}으로 들어가기</button>
      </form></div>`;
    const inp=$('#jCode');
    inp.oninput=()=>{inp.value=inp.value.replace(/\D/g,'').slice(0,6);if(inp.value.length===6){inp.classList.remove('err');$('#jErr').hidden=true;}};
    $('#jDemo').onclick=()=>{inp.value=S?S.event.code:'482913';inp.classList.remove('err');$('#jErr').hidden=true;$('#jForm').requestSubmit?$('#jForm').requestSubmit():$('#jForm').onsubmit(new Event('submit'));};
    $('#jForm').onsubmit=e=>{
      e.preventDefault();
      const v=inp.value;
      if(v.length!==6){$('#jErr').hidden=false;$('#jErr').textContent='참여 코드 6자리를 모두 입력해 주세요';inp.classList.add('err');return;}
      if(!S){$('#jErr').hidden=false;$('#jErr').textContent='연결하는 중이에요. 잠시 후 다시 눌러 주세요';return;}
      if(v!==S.event.code){$('#jErr').hidden=false;$('#jErr').textContent='참여 코드를 다시 확인해 주세요';inp.classList.add('err');return;}
      entered=true;history.replaceState(null,'','#join='+v);act({kind:'join'});
    };
  }

  let built=false;
  function render(){
    if(!S){
      if(!entered){entryScreen();return;}
      app.innerHTML=`<div class="p"><div class="p-band">제안용 데모 · 예시</div><div class="p-main" style="padding-top:32px"><div class="card p-card"><div class="skel" style="width:40%"></div><div class="skel" style="margin-top:16px;height:24px"></div><div class="skel" style="margin-top:24px;height:56px"></div><div class="skel" style="margin-top:8px;height:56px"></div><p class="help" style="margin-top:16px">행사에 연결하는 중…</p></div></div></div>`;
      return;
    }
    if(!entered){if(!$('#jForm'))entryScreen();return;}
    if(codeFromUrl&&codeFromUrl!==S.event.code&&!built){entered=false;entryScreen('이 참여 코드의 행사를 찾지 못했어요. 코드를 다시 확인해 주세요');return;}
    if(!built){shell();built=true;if(!S.joined[CLIENT])act({kind:'join'});}
    $('#pEv').textContent=S.event.name;
    $('#pCode').textContent=fmtCode(S.event.code);
    $('#pPc').textContent=fmtN(pcount(S));
    $('#pMode').innerHTML=synced?'<span class="chip ok"><i></i>실시간 연결</span>':'<span class="chip neu"><i></i>혼자 보기</span>';
    $('#pFoot').textContent=synced?'진행자 화면과 실시간으로 연결돼 있어요. 실제 서비스는 웹소켓으로 연결해요.'
      :'진행자 화면이 열려 있지 않아 혼자 보기로 보여 줘요. 다른 사람 응답과 진행 순서는 예시로 자동 진행돼요. 같은 브라우저에서 진행자 화면을 열면 실시간으로 연결돼요.';
    const open=S.questions.filter(q=>q.status==='open'||q.status==='answered');
    $('#pQn').textContent=open.length?' '+open.length:'';
    $('#pVote').hidden=ptab!=='vote';$('#pQa').hidden=ptab!=='qa';
    const ac=activeOf(S);
    if(lastActive!==null&&ac&&ac.id!==lastActive)toast('새 활동이 올라왔어요'+(ptab==='qa'?' · 투표 탭에서 볼 수 있어요':''));
    lastActive=ac?ac.id:'';
    renderVote(ac);renderQa();
  }

  function renderVote(ac){
    const box=$('#pVote');
    if(!ac){
      if(voteKey!=='none'){voteKey='none';box.innerHTML=`<div class="card p-card"><div class="empty"><span class="e-ic">${ic('poll')}</span><b>진행자가 다음 질문을 준비하고 있어요</b><p>질문은 Q&amp;A 탭에서 언제든 남길 수 있어요.</p></div></div>`;}
      $('#pCta').hidden=true;return;
    }
    const my=ac.voters[CLIENT];
    const myKey=ac.type==='cloud'?(my||[]).join('|'):(my||'');
    const key=[ac.id,ac.type,myKey,ac.closed,ac.revealed,ac.showResult,(ac.options||[]).map(o=>o.id).join(',')].join('~');
    if(key!==voteKey){
      voteKey=key;rv=null;cloudRv=null;
      const head=`<div class="chips"><span class="chip type">${ic(ac.type,'sm')}${TYPE[ac.type]}</span>${ac.closed?'<span class="chip neu"><i></i>마감</span>':''}</div><h2 class="p-q">${esc(ac.title)}</h2>`;
      let body='';
      if(ac.type==='cloud'){
        const mine=my||[];
        body=ac.closed?`<p class="help" style="margin-bottom:12px">단어 받기가 마감됐어요.</p>`:
          `<form class="cloud-in" id="wForm" novalidate><label class="sr" for="wIn">단어</label><input class="in" id="wIn" maxlength="12" placeholder="${mine.length>=3?'3개를 모두 보냈어요':'단어 하나 (12자까지)'}" ${mine.length>=3?'disabled':''} autocomplete="off"><button class="btn primary" type="submit" ${mine.length>=3?'disabled':''}>보내기</button></form>
           <p class="help" style="margin-top:8px">한 사람당 3개까지 보낼 수 있어요 (${mine.length}/3)</p>`;
        if(mine.length)body+=`<div class="mywords">${mine.map(w=>`<span class="tag me">${esc(w)}</span>`).join('')}</div>`;
        body+=ac.showResult?`<div id="pCloud" style="margin-top:16px"></div>`:`<p class="p-sub">단어 모음은 진행자 화면에서 보여요.</p>`;
      }else if(!my&&!ac.closed){
        body=`<div role="radiogroup" aria-label="선택지">${ac.options.map(o=>`<button class="opt" role="radio" data-opt="${o.id}" aria-checked="${sel[ac.id]===o.id}"><span class="rd"></span><span>${esc(o.label)}</span></button>`).join('')}</div>`;
      }else{
        const pick=ac.options.find(o=>o.id===my);
        if(ac.type==='quiz'){
          if(!ac.revealed)body=`<div class="p-done"><span class="chip info"><i></i>답을 보냈어요</span></div><p class="help">내 답: ${pick?esc(pick.label):'없음'}</p><p class="p-sub">진행자가 정답을 공개하면 여기에 바로 알려 드려요.</p>`;
          else{const right=my===ac.correct,cor=ac.options.find(o=>o.id===ac.correct);
            body=`<div class="p-done">${right?'<span class="chip ok"><i></i>정답이에요</span>':my?'<span class="chip bad"><i></i>아쉬워요</span>':'<span class="chip neu"><i></i>답을 보내지 않았어요</span>'}</div>${right?'':`<p class="help" style="margin-bottom:16px">정답: ${esc(cor?cor.label:'')}</p>`}<div id="pRes"></div>`;}
        }else{
          body=`<div class="p-done">${my?`<span class="chip ok"><i></i>투표했어요</span><span class="help">내 선택: ${esc(pick?pick.label:'')}</span>`:'<span class="chip neu"><i></i>투표가 마감됐어요</span>'}</div>`+
            (ac.showResult?`<div id="pRes"></div><p class="p-sub num" id="pTot"></p>`:`<p class="p-sub">결과는 진행자 화면에서 공개돼요.</p>`);
        }
      }
      box.innerHTML=`<div class="card p-card">${head}${body}</div>`;
      const wf=$('#wForm');
      if(wf)wf.onsubmit=e=>{e.preventDefault();const v=normWord($('#wIn').value);if(!v){$('#wIn').classList.add('err');$('#wIn').focus();return;}
        if((ac.voters[CLIENT]||[]).includes(v)){toast('이미 보낸 단어예요');return;}
        act({kind:'word',aid:ac.id,word:v});toast('단어를 보냈어요');setTimeout(()=>{const x=$('#wIn');x&&!x.disabled&&x.focus();},0);};
      if($('#pRes'))rv=new ResultView($('#pRes'),'sm');
      if($('#pCloud'))cloudRv=new ResultView($('#pCloud'),'sm');
    }
    if(rv)rv.update(ac,ac.voters[CLIENT]);
    if(cloudRv)cloudRv.update(ac);
    const tot=$('#pTot');if(tot)tot.textContent='지금까지 '+respondents(ac)+'명이 응답했어요';
    updateCta(ac);
  }
  function updateCta(ac){
    const show=ptab==='vote'&&ac&&ac.type!=='cloud'&&!ac.voters[CLIENT]&&!ac.closed;
    $('#pCta').hidden=!show;
    if(!show)return;
    const b=$('#pSubmit');
    b.textContent=ac.type==='quiz'?'답 보내기':'투표하기';
    b.disabled=!sel[ac.id];
    $('#pHint').textContent=sel[ac.id]?'보낸 뒤에는 바꿀 수 없어요':'선택지를 하나 골라 주세요';
  }
  function renderQa(){
    if(!$('#pQl'))return;
    likesT.scan(S.questions);
    const mine=S.questions.filter(q=>q.by===CLIENT&&q.status==='pending');
    const list=S.questions.filter(q=>q.status==='open'||q.status==='answered')
      .sort(qaSort==='hot'?(a,b)=>b.likes-a.likes||a.ts-b.ts:(a,b)=>b.ts-a.ts);
    let h=mine.map(q=>`<div class="q" data-qid="${q.id}"><div class="q-main"><p class="q-t">${esc(q.text)}</p><p class="q-m"><span class="chip warn"><i></i>검토 중</span><span>진행자가 확인하면 공개돼요</span></p></div></div>`).join('');
    h+=list.length?list.map(q=>{const on=!!q.likers[CLIENT];return `<div class="q" data-qid="${q.id}">
      <div class="q-main"><p class="q-t">${esc(q.text)}</p><p class="q-m"><span>${esc(q.name)}${q.by===CLIENT?' (나)':''}</span><span aria-hidden="true">·</span><span>${ago(q.ts)}</span>${q.status==='answered'?'<span class="chip ok"><i></i>답변함</span>':''}</p></div>
      <button class="like num${likesT.cls(q)}" data-like="${q.id}" aria-pressed="${on}" aria-label="좋아요 ${q.likes}개${on?', 누름':''}">${ic('thumb','sm')}${q.likes}</button></div>`;}).join('')
      :(mine.length?'':`<div class="empty"><span class="e-ic">${ic('qa')}</span><b>아직 질문이 없어요</b><p>첫 질문을 남겨 보세요. 다른 사람이 좋아요를 누르면 위로 올라가요.</p></div>`);
    flipHTML($('#pQl'),h);
  }
  setInterval(()=>{if(S&&built)renderQa();},30000);
  window.__demo={get S(){return S;},get synced(){return synced;}};
  render();
}
})();
</script>
</body>
</html>
